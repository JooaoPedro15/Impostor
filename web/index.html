<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Substituído pelo valor de `flutter build web --base-href /caminho/`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Jogo do impostor com temas de Ciência da Computação. Passe o celular e descubra quem está fingindo.">
  <meta name="theme-color" content="#18206B">

  <!-- Instalação na tela de início (Android e iPhone) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Impostor CC">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Impostor CC</title>

  <style>
    html, body { margin: 0; height: 100%; background: #18206B; }
    #carregando {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      padding: 24px; text-align: center;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #fff;
    }
    #carregando p { margin: 0; font-size: 20px; font-weight: 700; }
    #carregando small { color: #BCC3F2; max-width: 30ch; font-size: 15px; line-height: 1.4; }
    /* disquete simplificado enquanto o Flutter carrega */
    .disco {
      width: 96px; height: 100px; position: relative; margin-bottom: 8px;
      background: #FFD23F;
      clip-path: polygon(0 0, 93% 0, 100% 5%, 100% 100%, 0 100%);
    }
    .disco::before {
      content: ''; position: absolute; left: 15%; width: 70%; top: 0; height: 48%;
      background: linear-gradient(90deg, #8F97A5, #EEF1F5, #9AA2B0);
      animation: espiar 1.6s ease-in-out infinite;
    }
    .disco::after {
      content: ''; position: absolute; left: 8%; right: 8%; bottom: 0; height: 42%;
      background: #F5F7FF; border-top: 6px solid #C79D00;
    }
    @keyframes espiar { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(30%); } }
    @media (prefers-reduced-motion: reduce) { .disco::before { animation: none; } }
  </style>
</head>
<body>
  <div id="carregando" role="status">
    <div class="disco" aria-hidden="true"></div>
    <p>Carregando o jogo</p>
    <small>Na primeira vez demora um pouco. Depois abre na hora, até sem internet.</small>
  </div>

  <script>
    // Some com a tela de carregamento quando o Flutter desenha o primeiro quadro.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('carregando');
      if (el) el.remove();
    });

    // Nosso service worker (gerado por tool/gerar_service_worker.dart) guarda
    // o app no aparelho para abrir sem internet.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
